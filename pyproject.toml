[project]
name = "iseg-boosted-unet"
version = "0.1.0"
description = "Two-stage boosted 3D U-Net for iSeg-2017 infant brain segmentation"
requires-python = ">=3.10"
dependencies = [
    "tensorflow>=2.19",
    "keras>=3.10",
    "nibabel>=5.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[tool.uv]
package = false
